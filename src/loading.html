<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
  />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card { text-align: center; max-width: 420px; padding: 24px; }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 22px; letter-spacing: 1px;
      color: #fff;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    #status { font-size: 13px; color: #8b949e; min-height: 20px; margin-bottom: 24px; }
    .spinner {
      width: 28px; height: 28px; margin: 0 auto;
      border: 3px solid #30363d; border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">DSH</div>
    <h1>DeepSeek Harness</h1>
    <div id="status">正在初始化本地服务…</div>
    <div class="spinner"></div>
  </div>
  <script>
    if (window.desktop && window.desktop.onStatus) {
      window.desktop.onStatus(function (text) {
        document.getElementById('status').textContent = text;
      });
    }
  </script>
</body>
</html>
